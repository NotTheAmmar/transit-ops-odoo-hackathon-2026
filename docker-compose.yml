services:
  db:
    image: postgres:16
    container_name: transit_ops_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18.0
    container_name: transit_ops_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: ${ODOO_HOST:-db}
      PORT: ${ODOO_PORT:-5432}
      USER: ${ODOO_USER:-odoo}
      PASSWORD: ${ODOO_PASSWORD:-odoo}
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf
      - ./addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
    command: odoo --config /etc/odoo/odoo.conf

volumes:
  db_data:
  odoo_data:

